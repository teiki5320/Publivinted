name = "publivinted"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Appli web statique (aussi publiée sur GitHub Pages depuis /docs) ; /api/* passe par le code.
[assets]
directory = "../docs"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "publivinted"
database_id = "8ebfdf96-e90c-4d40-bca3-a4aae3fd016a"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "publivinted-photos"

# Secret (à poser avec wrangler, jamais dans le dépôt) :
#   wrangler secret put APP_TOKEN   -> code d'accès de l'appli, de l'extension et du programme du Mac
# Pas de clé API Claude : les annonces sont rédigées sur le Mac (mac/agent.mjs) avec l'abonnement.
